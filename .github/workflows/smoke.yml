name: Smoke test production

on:
  schedule:
    - cron: "0 4 * * *" # 9:30 IST, after the daily reminder job
  workflow_dispatch:
    inputs:
      url:
        description: "Site to test"
        default: "https://expensly-tracker.vercel.app"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/smoke.mjs "${{ inputs.url || 'https://expensly-tracker.vercel.app' }}"
